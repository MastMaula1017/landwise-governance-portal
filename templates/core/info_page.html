{% extends 'base.html' %}

{% block title %}{{ page_title }} — LANDWISE{% endblock %}

{% block content %}
<div class="py-5" style="background-color: #F8F5EE; min-height: 75vh;">
  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card border-0 rounded-4 shadow-sm p-4 p-md-5" style="background-color: #FFFFFF; border: 1px solid var(--lw-border-subtle) !important;">
          <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 mb-3 align-self-start" style="font-size: 0.72rem;">
            {{ page_eyebrow }}
          </span>
          <h1 class="font-serif fw-bold text-dark mb-3">{{ page_title }}</h1>
          <p class="text-muted mb-4">{{ page_lead }}</p>
          <hr class="my-4">
          {% for section in sections %}
            <div class="mb-4">
              <h5 class="font-serif fw-bold text-dark mb-2">{{ section.heading }}</h5>
              <p class="text-muted mb-0" style="line-height: 1.75;">{{ section.body }}</p>
            </div>
          {% endfor %}
          <div class="pt-3 border-top d-flex justify-content-between align-items-center">
            <a href="{% url 'core:index' %}" class="lw-btn lw-btn-outline py-2 px-4 small">&larr; Back to Home</a>
            <a href="{% url 'repository:document_list' %}" class="lw-btn lw-btn-primary py-2 px-4 small">Explore Repository</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
